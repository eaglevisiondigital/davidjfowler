name: Add Faith Boost schedule item

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-faith-boost-schedule.yml'
      - 'scripts/add_faith_boost_schedule.py'

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Add recurring Faith Boost schedule card
        run: python3 scripts/add_faith_boost_schedule.py
      - name: Commit schedule update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css
          if git diff --cached --quiet; then
            echo 'Faith Boost schedule item is already current.'
          else
            git commit -m 'Add daily Faith Boost Broadcast to ministry schedule'
            git push origin HEAD:main
          fi
