name: Build social sharing preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-preview.yml'
      - 'scripts/build_social_preview.py'
      - 'assets/dave-fowler-portrait.jpeg'
      - 'assets/djf-monogram.png'

permissions:
  contents: write

concurrency:
  group: davidjfowler-social-preview
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
      - name: Render approved brand assets and connect sharing metadata
        run: python scripts/build_social_preview.py
      - name: Commit generated preview and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/david-j-fowler-social-preview-v18.jpg assets/david-j-fowler-social-preview-v18.png index.html
          if git diff --cached --quiet; then
            echo 'Sharing preview is already current.'
          else
            git commit -m 'Publish David J. Fowler social sharing preview'
            git push origin HEAD:main
          fi
