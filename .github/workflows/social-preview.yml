name: Publish approved social preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/david-j-fowler-social-approved-v19.jpg'

permissions:
  contents: write

concurrency:
  group: davidjfowler-social-preview
  cancel-in-progress: false

jobs:
  connect-approved-preview:
    if: github.repository == 'eaglevisiondigital/davidjfowler' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eaglevisiondigital/davidjfowler
          ref: main
      - name: Connect approved static image without rendering or fonts
        run: python3 scripts/build_social_preview.py
      - name: Validate thumbnail and homepage metadata
        run: python3 scripts/build_social_preview.py --check
      - name: Commit homepage metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'Approved thumbnail is already connected.'
          else
            git commit -m 'Connect exact approved social image for DavidJFowler.com only'
            git push origin HEAD:main
          fi
      - name: Report exact scope
        run: |
          echo '### DavidJFowler.com social metadata connected' >> "$GITHUB_STEP_SUMMARY"
          echo 'Uses the uploaded approved image without changing any image pixels.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only index.html in eaglevisiondigital/davidjfowler can be modified. No other domains or repositories are touched.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This confirms repository metadata, not the downstream hosting deployment or cached social previews.' >> "$GITHUB_STEP_SUMMARY"
